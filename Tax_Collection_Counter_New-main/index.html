        }
      }
    </script>
    <style>
      .chart-transition {
        transition: d 0.5s ease-in-out, all 0.5s ease-in-out;
      }
      @keyframes scan {
        0%, 100% { top: 0%; }
        50% { top: 100%; }
      }
      .animate-scan {
        animation: scan 2s ease-in-out infinite;
      }
      /* Custom scrollbar for modern sleek feel */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #c4c6d3;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #747783;
      }
    </style>

  <body class="bg-surface-background text-on-surface font-body-md h-screen overflow-hidden antialiased">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.jsx"></script>
